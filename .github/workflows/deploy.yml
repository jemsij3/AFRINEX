# Required GitHub Repository Secrets (Settings -> Secrets and variables -> Actions):
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# Also replace the placeholder database_id in wrangler.toml before pushing to main.
name: Deploy AFRINEX to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend and Worker
        run: npm run lint

      - name: Build SPA bundle
        run: npm run build

      - name: Validate Wrangler Worker bundle (dry-run)
        run: npx wrangler deploy --dry-run

      - name: Validate D1 migration script syntax
        run: node --check scripts/migrate-remote-d1.mjs

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA bundle
        run: npm run build

      - name: Verify Cloudflare deployment prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "ERROR: Replace the placeholder database_id in wrangler.toml with your Cloudflare D1 UUID from 'npx wrangler d1 create afrinex-db'."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: Missing GitHub Repository Secret CLOUDFLARE_API_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: Missing GitHub Repository Secret CLOUDFLARE_ACCOUNT_ID (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Reconcile Stage 0 schema & apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate-remote-d1.mjs --remote

      - name: Deploy Cloudflare Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

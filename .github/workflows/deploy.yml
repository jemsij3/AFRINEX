# Required GitHub Repository Secrets (Settings -> Secrets and variables -> Actions):
#   - CLOUDFLARE_API_TOKEN (must include Account -> D1 -> Edit and Account -> Workers Scripts -> Edit)
#   - CLOUDFLARE_ACCOUNT_ID (32-character Cloudflare Account ID)
# Also replace the placeholder database_id in wrangler.toml before pushing to main.
name: Deploy AFRINEX to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend and Worker
        run: npm run lint

      - name: Build SPA bundle
        run: npm run build

      - name: Validate Wrangler Worker bundle (dry-run)
        run: npx wrangler deploy --dry-run

      - name: Validate D1 and bot token migration scripts syntax
        run: |
          node --check scripts/migrate-remote-d1.mjs
          node --check scripts/encrypt-bot-tokens.mjs

      - name: Run automated security and integration tests
        run: npm test

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA bundle
        run: npm run build

      - name: Verify Cloudflare deployment prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::error title=Missing D1 Database ID::Replace the placeholder database_id in wrangler.toml with your Cloudflare D1 UUID."
            exit 1
          fi
          TRIMMED_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          TRIMMED_ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$TRIMMED_TOKEN" ]; then
            echo "::error title=Missing API Token::Missing GitHub Repository Secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "$TRIMMED_ACCOUNT" ]; then
            echo "::error title=Missing Account ID::Missing GitHub Repository Secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if ! printf '%s' "$TRIMMED_ACCOUNT" | grep -Eq '^[a-fA-F0-9]{32}$'; then
            echo "::error title=Invalid Account ID::CLOUDFLARE_ACCOUNT_ID does not look like a 32-character Cloudflare Account ID."
            exit 1
          fi

      - name: Reconcile Stage 0 schema & apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate-remote-d1.mjs --remote

      - name: Deploy Cloudflare Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS || secrets.ADMIN_TELEGRAM_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          TRIMMED_ADMIN_IDS="$(printf '%s' "$ADMIN_TELEGRAM_IDS" | tr -d '\r\n')"
          if [ -n "$TRIMMED_ADMIN_IDS" ]; then
            printf '%s' "$TRIMMED_ADMIN_IDS" | npx wrangler secret put ADMIN_TELEGRAM_IDS
          fi
          npx wrangler deploy
